name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner ubuntu-latest sudah membawa Android SDK (ANDROID_HOME).
      # Cukup pastikan lisensi diterima agar Gradle bisa mengunduh komponen yang kurang.
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          ls -l "$APK"; sha256sum "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | head -n 20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZackGameSpace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
